<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Layout Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">

        <header>
            <h1>Contact</h1>
        </header>

        <nav>
            <a href="home.html">Home</a>
            <a href="artikel.html">Artikel</a>
            <a href="About.html">About</a>
            <a href="kontak.html" class="active">Kontak</a>
        </nav>

        <section id="hero">
            <h1>Hubungi Saya</h1>
            <p>
                Silakan isi formulir berikut untuk mengirimkan
                pertanyaan, saran, atau pesan.
            </p>
        </section>

        <section id="main">
            <h2>Form Contact</h2>

            <form class="contact-form" action="#" method="post">

                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama"
                    placeholder="Masukkan nama lengkap" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                    placeholder="Masukkan alamat email" required>

                <label for="subjek">Subjek</label>
                <input type="text" id="subjek" name="subjek"
                    placeholder="Masukkan subjek pesan" required>

                <label for="pesan">Pesan</label>
                <textarea id="pesan" name="pesan" rows="6"
                    placeholder="Tuliskan pesan kamu" required></textarea>

                <button type="submit" class="btn btn-default">
                    Kirim Pesan
                </button>

            </form>
        </section>

        <footer>
            <p>&copy; 2026 - Universitas Pelita Bangsa</p>
        </footer>

    </div>
</body>
</html>
